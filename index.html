<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 첫 페인트 전에 테마를 정해 깜빡임을 막는다. 저장된 값이 없으면 시스템 설정을 따른다.
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem("theme")
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.dataset.theme = theme
        // 스크립트가 돈다는 표시. 선 그림은 이것을 보고 그려지기 전까지 감춘다 (styles/line-room.css)
        document.documentElement.dataset.js = ""
        // 글을 읽기 모드(평범한 글)로 보기로 했으면 그대로 연다.
        // 개발 중 확인용: localStorage의 motion이 "full"이면 시스템이 동작 줄이기여도 움직인다 (화면에 버튼은 없다).
        try {
          if (localStorage.getItem("motion") === "full") {
            document.documentElement.dataset.motion = "full"
          }
          if (localStorage.getItem("post-view") === "plain") {
            document.documentElement.dataset.view = "plain"
          }
        } catch (e) {}
      })()
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="alternate" type="application/rss+xml" title="chanii's notes" href="/index.xml" />
    <!--app-head-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
