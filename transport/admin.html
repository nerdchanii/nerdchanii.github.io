<style>

@media (prefers-color-scheme: dark){ :root{ color-scheme:dark;

canvas.pad{display:block;width:100%;background:var(--pad);border:1px solid var(--padline);border-radius:8px;background-image:linear-gradient(var(--padline) 1px,transparent 1px);background-size:100% 28px;margin-top:8px}
.padwrap .lbl{font-size:12px;color:var(--muted);margin-bottom:3px}
.step-body h3{margin:0 0 4px;font:700 17px/1.3 "Gowun Batang",serif}

.figbox{color:var(--ink);background:var(--bg);border-radius:12px;padding:10px;min-height:160px;display:flex;align-items:center;justify-content:center}

.step-nav{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.step-nav button{all:unset;cursor:pointer;padding:7px 12px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600;font-size:13.5px}

.dots button[aria-current="true"]{background:var(--accent);color:#fff}
</style></head><body>
<div class="wrap">
<header class="top"><h1 id="homeLink">모의고사 관리자</h1><div class="who" id="who"></div></header>
<section id="loginView"><div class="card login"><h2>관리자 로그인</h2><div class="note">선생님만 들어오는 화면이에요.</div>
  <label for="inPw">비밀번호</label><input type="password" id="inPw" autocomplete="off">
  <div class="err" id="loginErr"></div><button class="btn primary" id="loginBtn" style="width:100%;margin-top:6px">들어가기</button></div></section>
<section id="mainView" hidden><div id="mainBody"></div></section>
<section id="reviewView" hidden><div id="reviewBody"></div></section>
</div>
<div class="toast" id="toast"></div>

<script>
const SB={url:"https://qtlamxyvrxaxklcksuqv.supabase.co", key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0bGFteHl2cnhheGtsY2tzdXF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMTUwMzgsImV4cCI6MjEwMzg5MTAzOH0.3fA3Vx1gP3TeroaPdmv0w2x1fj6kP9PjxKEtX-Q_a0M"};
const CIRC="①②③④⑤";
const UNITS={iso:"이등변삼각형",rt:"직각삼각형의 합동",circ:"외심",inc:"내심",pg:"평행사변형",quad:"여러 가지 사각형",area:"평행선과 넓이"};
const U=k=>UNITS[k]||k;
const STATUS={strong:{label:"확실",cls:"strong"},watch:{label:"주의",cls:"watch"},hole:{label:"구멍",cls:"hole"},unknown:{label:"미확인",cls:"unknown"}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
let token=null, students=[], curStudent=null, curTab="concepts";
const cache={concepts:null, sets:null, problems:{}, full:{}, conceptStatus:{}, studentConcepts:{}, notes:{}, attempts:{}, genReqs:[]};
const pads={};

async function sb(path, method="GET", body=null, prefer=""){
  const h={apikey:SB.key, Authorization:"Bearer "+SB.key, "Content-Type":"application/json"}; if(prefer) h.Prefer=prefer;
  const r=await fetch(SB.url+"/rest/v1/"+path,{method, headers:h, body:body?JSON.stringify(body):null});
  if(!r.ok) throw new Error("sb "+r.status+" "+(await r.text()).slice(0,300));
  const t=await r.text(); return t?JSON.parse(t):null;
}
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("show"); setTimeout(()=>e.classList.remove("show"),2000); }
function fmt(sec){ sec=Math.max(0,Math.floor(sec||0)); return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0"); }
function ansArr(p){ return Array.isArray(p.answer)?p.answer:[p.answer]; }
function sameAns(a,b){ return (a||[]).slice().sort().join(",")===(b||[]).slice().sort().join(","); }
function showView(v){ ["loginView","mainView","reviewView"].forEach(k=>$("#"+k).hidden=(k!==v)); window.scrollTo({top:0}); }

// tiny markdown-lite renderer for note bodies (headers, bold, tables, lists, hr)
function mdLite(src){
  const lines=String(src||"").split("\n"); let html="", inTable=false, inList=false;
  const closeList=()=>{ if(inList){ html+="</ul>"; inList=false; } };
  const closeTable=()=>{ if(inTable){ html+="</table>"; inTable=false; } };
  const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");
  for(let raw of lines){
    const line=raw.trim();
    if(!line){ closeList(); closeTable(); continue; }
    if(/^#{1,3}\s/.test(line)){ closeList(); closeTable(); const lvl=line.match(/^#+/)[0].length; html+=`<h${Math.min(lvl+1,4)}>${inline(line.replace(/^#+\s*/,""))}</h${Math.min(lvl+1,4)}>`; continue; }
    if(/^-{3,}$/.test(line)){ closeList(); closeTable(); html+="<hr>"; continue; }
    if(/^\|/.test(line)){ closeList(); const cells=line.split("|").slice(1,-1).map(c=>c.trim()); if(cells.every(c=>/^-+$/.test(c))) continue; if(!inTable){ html+="<table>"; inTable=true; } html+="<tr>"+cells.map(c=>`<td>${inline(c)}</td>`).join("")+"</tr>"; continue; }
    if(/^-\s/.test(line)){ closeTable(); if(!inList){ html+="<ul>"; inList=true; } html+=`<li>${inline(line.replace(/^-\s*/,""))}</li>`; continue; }
    closeList(); closeTable(); html+=`<p>${inline(line)}</p>`;
  }
  closeList(); closeTable(); return html;
}

// ---------- auth ----------
function renderWho(){ $("#who").innerHTML=token?`<button class="btn small ghost" id="pwBtn">비밀번호 변경</button><button class="btn small ghost" id="logoutBtn">나가기</button>`:""; }
$("#who").addEventListener("click", e=>{
  if(e.target.id==="logoutBtn"){ token=null; try{localStorage.removeItem("mock_admin_token");}catch(x){} renderWho(); showView("loginView"); }
  if(e.target.id==="pwBtn"){ changePassword(); }
});
$("#homeLink").addEventListener("click",()=>{ if(token) renderMain(); });
$("#loginBtn").addEventListener("click",login); $("#inPw").addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });
async function login(){
  const pw=$("#inPw").value; const err=$("#loginErr"); err.textContent="";
  if(!pw){ err.textContent="비밀번호를 넣어요."; return; }
  $("#loginBtn").disabled=true; $("#loginBtn").textContent="확인 중…";
  try{ let t=null; try{ t=await sb("rpc/admin_login","POST",{p_password:pw}); }catch(e){ err.textContent="서버에 연결이 안 돼요."; return; }
    if(!t){ err.textContent="비밀번호가 맞지 않아요."; return; }
    token=t; try{ localStorage.setItem("mock_admin_token", token); }catch(e){}
    renderWho(); await renderMain();
  } finally { $("#loginBtn").disabled=false; $("#loginBtn").textContent="들어가기"; }
}
async function changePassword(){
  const p1=prompt("새 비밀번호 (4자 이상)"); if(!p1) return;
  try{ await sb("rpc/admin_change_password","POST",{p_token:token,p_new_password:p1}); toast("비밀번호를 바꿨어요."); }
  catch(e){ toast("변경 실패: 다시 시도해요."); }
}

// ---------- data ----------
async function getConcepts(){ if(cache.concepts) return cache.concepts; const rows=await sb("mock_concepts?select=id,name,group,ord,prereq,summary,trap,svg&order=ord"); cache.concepts={}; rows.forEach(c=>cache.concepts[c.id]=c); return cache.concepts; }
async function getSets(){ if(cache.sets) return cache.sets; cache.sets=await sb("mock_sets?select=*&order=id"); return cache.sets; }
async function getProblems(setId){ if(cache.problems[setId]) return cache.problems[setId];
  const rows=await sb("mock_problem_full?select=set_id,n,unit,pts,stem,choices,answer,multi,fig,sol,trap,fb_wrong,pattern_a,concepts&set_id=eq."+setId+"&order=n");
  cache.problems[setId]=rows; return rows; }
async function getFull(setId){ if(cache.full[setId]) return cache.full[setId];
  const rows=await sb("mock_problem_full?select=n,pattern,hole,diagnosis,steps,check,practice&set_id=eq."+setId+"&order=n");
  cache.full[setId]={}; rows.forEach(r=>cache.full[setId][r.n]=r); return cache.full[setId]; }
function setOf(id){ return (cache.sets||[]).find(s=>s.id===id)||{id,title:"모의고사 "+id+"회"}; }
async function loadStudents(){ students=await sb("rpc/admin_list_students","POST",{p_token:token}); return students; }
async function loadStudentData(sid){
  const [cs, sc, att, gens] = await Promise.all([
    sb("rpc/admin_list_concept_status","POST",{p_token:token,p_student_id:sid}),
    sb("mock_student_concepts?select=*&student_id=eq."+encodeURIComponent(sid)),
    sb("mock_attempts?select=id,set_id,submitted_at,seconds,score,by_unit&student_id=eq."+encodeURIComponent(sid)+"&order=submitted_at.desc"),
    sb("rpc/admin_list_gen_requests","POST",{p_token:token})
  ]);
  cache.conceptStatus[sid]={}; (cs||[]).forEach(r=>cache.conceptStatus[sid][r.concept_id]=r);
  cache.studentConcepts[sid]={}; (sc||[]).forEach(r=>cache.studentConcepts[sid][r.concept_id]=r);
  cache.attempts[sid]=att||[];
  cache.genReqs=gens||[];
  cache.notes[sid]=await sb("rpc/admin_list_notes","POST",{p_token:token,p_student_id:sid});
}

// ---------- main dashboard ----------
async function renderMain(){
  showView("mainView"); const host=$("#mainBody"); host.innerHTML=`<div class="loading">불러오는 중…</div>`;
  await Promise.all([getConcepts(), getSets(), loadStudents()]);
  if(!curStudent && students.length) curStudent=students[0].id;
  host.innerHTML=`<div class="adm"><nav class="side" id="side"></nav><div id="stuMain"></div></div>`;
  renderSide(); if(curStudent) await renderStudent(curStudent); else $("#stuMain").innerHTML=`<div class="card">아직 학생이 없어요. 왼쪽에서 새 학생을 만들어요.</div>`;
}
function renderSide(){
  const host=$("#side");
  host.innerHTML = students.map(s=>`<div class="stu-row ${s.id===curStudent?'cur':''} ${s.active?'':'dim'}" data-sid="${s.id}"><span>${esc(s.name)}${s.active?'':' (비활성)'}</span></div>`).join("")
    + `<button class="new-stu" id="newStuBtn">＋ 새 학생</button>`;
  host.onclick=e=>{ const row=e.target.closest(".stu-row"); if(row){ curStudent=row.dataset.sid; renderSide(); renderStudent(curStudent); return; }
    if(e.target.id==="newStuBtn") newStudent(); };
}
async function newStudent(){
  const name=prompt("학생 이름"); if(!name) return;
  const pin=prompt("암호 (숫자 등, 학생에게 알려줄 값)"); if(!pin) return;
  try{ const id=await sb("rpc/admin_create_student","POST",{p_token:token,p_name:name,p_pin:pin});
    await loadStudents(); curStudent=id; renderSide(); await renderStudent(id); toast("학생을 만들었어요."); }
  catch(e){ toast("만들지 못했어요: "+(e.message||"").slice(0,80)); }
}
async function renderStudent(sid){
  const host=$("#stuMain"); host.innerHTML=`<div class="loading">불러오는 중…</div>`;
  const s=students.find(x=>x.id===sid); if(!s){ host.innerHTML=""; return; }
  await loadStudentData(sid);
  let h=`<div class="card"><div class="field-row">
    <div class="f"><label>이름</label><input type="text" id="edName" value="${esc(s.name)}"></div>
    <div class="f"><label>암호</label><input type="text" id="edPin" value="${esc(s.pin)}"></div>
    <label class="chk"><input type="checkbox" id="edActive" ${s.active?'checked':''}> 활성</label>
    <button class="btn small" id="saveStuBtn">저장</button>
  </div>
  <div class="field-row" style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px">
    <div class="f"><label>다음 문제 생성 요청 — 메모(선택)</label><input type="text" id="genNote" placeholder="예: 내접원 넓이·평행선과 넓이 위주로"></div>
    <button class="btn primary small" id="genBtn">다음 문제 생성 요청</button>
  </div>`;
  const pend=cache.genReqs.filter(g=>g.student_id===sid);
  if(pend.length) h+=`<div class="note" style="margin-top:8px">${pend.map(g=>`<div>· [${g.status==='pending'?'대기중':g.status==='done'?'완료':'취소'}] ${esc(g.note||'(메모 없음)')} — ${new Date(g.requested_at).toLocaleString("ko-KR")} ${g.status==='pending'?`<button class="btn small ghost" data-resolve="${g.id}" data-status="done">완료로 표시</button><button class="btn small ghost" data-resolve="${g.id}" data-status="dismissed">취소</button>`:''}</div>`).join("")}</div>`;
  h+=`</div>`;

  h+=`<h2 class="sec">개념 상태</h2><div class="legend"><span><i style="background:var(--green)"></i>확실</span><span><i style="background:var(--amber)"></i>주의(사소한 구멍/암기)</span><span><i style="background:var(--rose)"></i>구멍</span><span><i style="background:var(--muted)"></i>미확인</span></div>`;
  h+=`<div id="conceptGrid"></div>`;

  h+=`<h2 class="sec">AI 코멘트 / 진단 노트</h2><div class="field-row"><div class="f"><input type="text" id="noteTitle" placeholder="제목"></div></div><textarea id="noteBody" rows="3" placeholder="메모 내용 (마크다운 간단히 지원)"></textarea><div style="margin:6px 0"><button class="btn small" id="addNoteBtn">메모 추가</button></div><div id="notesList"></div>`;

  h+=`<h2 class="sec">시험 결과</h2><div id="attList"></div>`;

  host.innerHTML=h;
  renderConceptGrid(sid); renderNotes(sid); renderAttempts(sid);

  $("#saveStuBtn").onclick=async()=>{
    try{ await sb("rpc/admin_update_student","POST",{p_token:token,p_id:sid,p_name:$("#edName").value,p_pin:$("#edPin").value,p_active:$("#edActive").checked});
      await loadStudents(); renderSide(); toast("저장했어요."); }
    catch(e){ toast("저장 실패"); }
  };
  $("#genBtn").onclick=async()=>{
    try{ await sb("rpc/admin_request_next_set","POST",{p_token:token,p_student_id:sid,p_note:$("#genNote").value||null});
      toast("요청을 등록했어요. 다음에 Claude와 대화할 때 처리해 드릴게요."); await renderStudent(sid); }
    catch(e){ toast("요청 실패"); }
  };
  $("#addNoteBtn").onclick=async()=>{
    const title=$("#noteTitle").value.trim(), body=$("#noteBody").value.trim(); if(!title||!body){ toast("제목과 내용을 넣어요."); return; }
    try{ await sb("rpc/admin_add_note","POST",{p_token:token,p_student_id:sid,p_title:title,p_body:body,p_kind:"note"}); $("#noteTitle").value=""; $("#noteBody").value=""; cache.notes[sid]=await sb("rpc/admin_list_notes","POST",{p_token:token,p_student_id:sid}); renderNotes(sid); toast("추가했어요."); }
    catch(e){ toast("추가 실패"); }
  };
  host.addEventListener("click", async e=>{
    const rb=e.target.closest("[data-resolve]"); if(rb){ await sb("rpc/admin_resolve_gen_request","POST",{p_token:token,p_id:+rb.dataset.id,p_status:rb.dataset.status}); await renderStudent(sid); }
  }, {once:true});
}
function renderConceptGrid(sid){
  const C=cache.concepts, cs=cache.conceptStatus[sid]||{}, sc=cache.studentConcepts[sid]||{};
  const groups={}; Object.values(C).forEach(c=>{ (groups[c.group]=groups[c.group]||[]).push(c); });
  let h="";
  for(const [g,list] of Object.entries(groups)){
    h+=`<div class="cgrp"><h4>${esc(g)}</h4><div class="cgrid">`;
    list.sort((a,b)=>a.ord-b.ord).forEach(c=>{
      const st=cs[c.id], m=sc[c.id];
      const status=st?st.status:"unknown"; const info=STATUS[status];
      const pctTxt=m?`${m.correct}/${m.attempted}${m.stuck?` · ★${m.stuck}`:''}`:"";
      h+=`<div class="cchip ${info.cls}" data-c="${c.id}"><h5>${esc(c.name)}</h5>${pctTxt?`<span class="pct">${pctTxt}</span>`:""}
        ${m?`<div class="meter ${m.pct>=70?'ok':''}"><i style="width:${m.pct}%"></i></div>`:""}
        <div class="detail" hidden>${esc(st&&st.note || c.summary || "")}</div></div>`;
    });
    h+="</div></div>";
  }
  const host=$("#conceptGrid"); host.innerHTML=h;
  host.onclick=e=>{ const chip=e.target.closest(".cchip"); if(!chip) return; const d=chip.querySelector(".detail"); d.hidden=!d.hidden; };
}
function renderNotes(sid){
  const list=cache.notes[sid]||[];
  $("#notesList").innerHTML = list.length ? list.map(n=>`<div class="note-card ${n.kind}"><div class="hd"><h4>${esc(n.title)}</h4><span class="meta">${esc(n.source||n.kind)} · ${new Date(n.created_at).toLocaleDateString("ko-KR")}</span></div><div class="body">${mdLite(n.body)}</div></div>`).join("")
    : `<p class="note">아직 메모가 없어요.</p>`;
}
function renderAttempts(sid){
  const list=cache.attempts[sid]||[];
  $("#attList").innerHTML = list.length ? list.map(a=>{
    const set=setOf(a.set_id); const byUnit=Object.entries(a.by_unit||{}).map(([u,v])=>`${U(u)} ${v}`).join(" · ");
    return `<div class="att-row" data-att="${a.id}" data-set="${a.set_id}"><span class="sc ${a.score>=70?'hi':'lo'}">${a.score}</span><span>${esc(set.title)} · ${new Date(a.submitted_at).toLocaleString("ko-KR")} · ${fmt(a.seconds)}</span><span class="note" style="margin-left:auto">${esc(byUnit)}</span></div>`;
  }).join("") : `<p class="note">아직 푼 시험이 없어요.</p>`;
  $("#attList").onclick=e=>{ const row=e.target.closest(".att-row"); if(row) openAttemptReview(row.dataset.att, +row.dataset.set); };
}

// ---------- read-only attempt review (adapted from student 오답노트) ----------
const W=1000;
class Pad{
  constructor(canvas, strokes){ this.c=canvas; this.ctx=canvas.getContext("2d"); this.strokes=strokes;
    this.hUnits=Math.max(200, strokes.reduce((m,s)=>{ for(let i=1;i<s.p.length;i+=2) m=Math.max(m,s.p[i]+40); return m; },0));
    this.resize(); this._rs=()=>this.resize(); window.addEventListener("resize",this._rs); }
  resize(){ const cssW=this.c.clientWidth||600; const cssH=Math.round(cssW*this.hUnits/W); const r=window.devicePixelRatio||1; this.c.style.height=cssH+"px"; this.c.width=Math.round(cssW*r); this.c.height=Math.round(cssH*r); this.scale=this.c.width/W; this.redraw(); }
  drawSeg(s,x1,y1,x2,y2){ const g=this.ctx,k=this.scale; g.save(); g.lineCap="round"; g.lineJoin="round"; g.lineWidth=s.w*k*1.6; g.strokeStyle="#1b2430"; if(s.e) g.globalCompositeOperation="destination-out"; g.beginPath(); g.moveTo(x1*k,y1*k); g.lineTo(x2*k,y2*k); g.stroke(); g.restore(); }
  drawStroke(s){ const p=s.p; if(p.length<4){ this.drawSeg(s,p[0],p[1],p[0]+1,p[1]+1); return; } for(let i=2;i<p.length;i+=2) this.drawSeg(s,p[i-2],p[i-1],p[i],p[i+1]); }
  redraw(){ this.ctx.clearRect(0,0,this.c.width,this.c.height); this.strokes.forEach(s=>this.drawStroke(s)); }
}
function padHtmlRO(n, strokes){ if(!strokes||!strokes.length) return ""; return `<div class="padwrap"><div class="lbl">학생 풀이(손글씨)</div><canvas class="pad" id="pad${n}"></canvas></div>`; }
function mountPadRO(n, strokes){ const c=document.getElementById("pad"+n); if(!c) return; pads[n]=new Pad(c, strokes); }

let RV=null; // {attemptId, setId, P, F, answers, stuck, stuckNote, scratch, order, p, step, concept}
async function openAttemptReview(attemptId, setId){
  showView("reviewView"); $("#reviewBody").innerHTML=`<div class="loading">불러오는 중…</div>`;
  try{
    const rows=await sb("mock_attempts?select=*&id=eq."+encodeURIComponent(attemptId));
    if(!rows.length){ toast("결과를 찾을 수 없어요"); showView("mainView"); return; }
    const A=rows[0]; const P=await getProblems(setId); const F=await getFull(setId);
    const answers={}; Object.entries(A.answers||{}).forEach(([k,v])=>answers[k]=String(v).split(",").filter(Boolean).map(Number));
    const scratchRows=await sb("mock_scratch?select=n,strokes&attempt_id=eq."+encodeURIComponent(attemptId));
    const scratch={}; scratchRows.forEach(r=>scratch[r.n]=r.strokes||[]);
    RV={A, setId, P, F, answers, stuck:{}, stuckNote:A.stuck_note||{}, scratch, p:null, step:0, concept:null};
    (A.stuck||[]).forEach(n=>RV.stuck[n]=true);
    renderReview();
  }catch(e){ toast("불러오지 못했어요"); showView("mainView"); }
}
function grade(P,answers){ const r={score:0, byUnit:{}, wrong:[], right:[], stuck:[]};
  P.forEach(p=>{ const ok=sameAns(answers[p.n],ansArr(p)); const u=r.byUnit[p.unit]=r.byUnit[p.unit]||{n:0,ok:0}; u.n++; if(ok){u.ok++;r.score+=p.pts;r.right.push(p.n);} else r.wrong.push(p.n); if(RV.stuck[p.n]) r.stuck.push(p.n); });
  return r; }
function stepsFor(p, F){ const f=F&&F[p.n]; if(f&&f.steps&&f.steps.length) return f.steps;
  return (p.sol||[]).map((s,i)=>({k:i+1, title:`단계 ${i+1}`, body:s, concepts:i===0?(p.concepts||[]):[], svg:p.fig||""})); }
function conceptPanel(C,id){ const c=C[id]; if(!c) return ''; const pre=(c.prereq||[]).length?`<div class="note">선수 개념: ${c.prereq.map(x=>esc(C[x]?C[x].name:x)).join(', ')}</div>`:'';
  return `<div class="card" style="margin-top:8px"><h5 style="margin:0 0 4px">${esc(c.name)}</h5><p style="margin:0 0 6px;font-size:13.5px">${esc(c.summary)}</p>${c.trap?`<p style="color:var(--rose);font-size:13px;margin:0">함정 · ${esc(c.trap)}</p>`:''}${pre}</div>`; }
function explCard(p, my, ok, f, C, steps, st){
  const s=steps[st.step]||steps[0], last=steps.length-1; const aa=ansArr(p);
  const choices=p.choices.map((c,i)=>{ const n=i+1; const isOk=aa.includes(n), bad=(my||[]).includes(n)&&!isOk; return `<div class="choice ${isOk?'ok':bad?'bad':''}"><span class="c">${CIRC[i]}</span><span>${c}</span>${isOk?'<span class="mark">정답</span>':bad?'<span class="mark">학생 답</span>':''}</div>`; }).join("");
  const diag = f&&f.diagnosis ? `<div class="diag"><span class="lbl">왜 틀렸나</span>${f.diagnosis}</div>` : (ok?'' : `<div class="diag"><span class="lbl">틀렸다면</span>${esc(p.fb_wrong||'')}${RV.stuckNote[p.n]?`<br>★ 학생이 남긴 메모: ${esc(RV.stuckNote[p.n])}`:''}</div>`);
  return `<section class="card"><div class="eyebrow"><span class="pattern">${esc((f&&f.pattern)||U(p.unit))}</span><span>${p.n}번 · ${esc(U(p.unit))} · ${p.pts}점 · ${ok?'맞음':'틀림'}${RV.stuck[p.n]?' · ★막힘':''}</span></div>
    <div class="problem-grid"><div><div class="stem">${p.stem}</div><div class="choices">${choices}</div></div>${p.fig?`<div class="fig-orig">${p.fig}</div>`:''}</div>
    ${padHtmlRO(p.n, RV.scratch[p.n])}${diag}</section>
  <section class="card"><div class="stepper"><div class="figbox">${s.svg||p.fig||''}</div><div class="step-body"><div class="k">STEP ${s.k} / ${steps.length}</div><h3>${s.title}</h3><p>${s.body}</p>
    <div class="step-nav"><button class="ghost" data-prev ${st.step===0?'disabled':''}>← 이전</button><button data-next>${st.step===last?'처음부터':'다음 →'}</button><div class="dots">${steps.map((_,i)=>`<button data-s="${i}" aria-current="${i===st.step}">${i+1}</button>`).join('')}</div></div>
    ${(s.concepts||[]).length?`<div class="note" style="margin-top:8px">개념: ${s.concepts.map(id=>esc(C[id]?C[id].name:id)).join(', ')}</div>`:''}
    ${st.concept?conceptPanel(C,st.concept):''}</div></div></section>
  ${f&&(f.check||f.practice)?`<section class="card"><div class="note"><b>검산</b> ${esc(f.check||'')}</div><div class="note" style="margin-top:6px"><b>다음 연습</b> ${esc(f.practice||'')}</div></section>`:''}`;
}
async function renderReview(){
  const C=await getConcepts(); const r=grade(RV.P, RV.answers);
  const wrong=r.wrong.map(n=>RV.P[n-1]);
  const order=[...r.wrong, ...r.right]; if(!RV.p) RV.p=order[0];
  let h=`<button class="btn small ghost" id="backBtn">← 학생 화면으로</button>
  <h2 class="sec">${esc(setOf(RV.setId).title)} · ${esc(RV.A.student_name||RV.A.student_id)}</h2>
  <div class="stats"><div class="stat ${r.score>=70?'green':'rose'}"><b>${r.score}</b>/100</div><div class="stat rose"><b>${wrong.length}</b>문제 틀림</div><div class="stat"><b>${r.stuck.length}</b>★막힘</div>${Object.entries(r.byUnit).map(([u,v])=>`<div class="stat ${v.ok<v.n?'':'green'}"><b>${v.ok}/${v.n}</b>${esc(U(u))}</div>`).join("")}</div>
  <div class="layout"><nav class="rail" id="rail"></nav><main class="expl" id="explMain"></main></div>`;
  $("#reviewBody").innerHTML=h;
  $("#backBtn").onclick=()=>{ showView("mainView"); };
  let railH=""; order.forEach(n=>{ const p=RV.P[n-1]; const isWrong=r.wrong.includes(n); railH+=`<button data-n="${n}"><span>${n}번</span><span class="tag ${isWrong?'':'ok'}">${isWrong?'✕':'○'}</span></button>`; });
  $("#rail").innerHTML=railH;
  $("#rail").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; RV.p=+b.dataset.n; RV.step=0; RV.concept=null; renderExpl(); };
  renderExpl();
}
function renderExpl(){
  const p=RV.P[RV.p-1]; const C=cache.concepts, F=RV.F; const f=F[p.n]; const steps=stepsFor(p,F); const my=RV.answers[p.n]; const ok=sameAns(my,ansArr(p));
  document.querySelectorAll('#rail button').forEach(b=>b.setAttribute('aria-current', +b.dataset.n===RV.p));
  const st={step:RV.step, concept:RV.concept};
  $("#explMain").innerHTML=explCard(p,my,ok,f,C,steps,st);
  mountPadRO(p.n, RV.scratch[p.n]||[]);
  $("#explMain").onclick=e=>{
    if(e.target.closest("[data-prev]")){ if(RV.step>0){ RV.step--; RV.concept=null; renderExpl(); } return; }
    if(e.target.closest("[data-next]")){ RV.step=RV.step===steps.length-1?0:RV.step+1; RV.concept=null; renderExpl(); return; }
    const d=e.target.closest(".dots button"); if(d){ RV.step=+d.dataset.s; RV.concept=null; renderExpl(); return; }
  };
}

// ---------- boot ----------
(function boot(){ try{ token=localStorage.getItem("mock_admin_token")||null; }catch(e){} renderWho(); if(token) renderMain(); else showView("loginView"); })();
