<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>모의고사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
:root{
  --bg:#f5f6f8; --paper:#ffffff; --ink:#1b2430; --ink2:#4b5563; --line:#d9dde3;
  --red:#d7263d; --red-soft:#fdecef; --green:#1f7a4d; --green-soft:#e6f4ec;
  --amber:#b45309; --amber-soft:#fff4e0; --blue:#2f5d8a; --blue-soft:#e8f0f8;
  --chip:#eef0f3; --focus:#2f5d8a; --pad:#fffdf5; --padline:#e4dfcc;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --bg:#14181d; --paper:#1d232a; --ink:#e8ebef; --ink2:#a4adb8; --line:#333b45;
  --red:#ff6b7d; --red-soft:#3a1f25; --green:#5fcf8d; --green-soft:#1c3328;
  --amber:#f3b25a; --amber-soft:#3a2d16; --blue:#8fb6df; --blue-soft:#1e2c3a; --chip:#2a323b; --focus:#8fb6df; --pad:#fffdf5; --padline:#e4dfcc; }}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#14181d; --paper:#1d232a; --ink:#e8ebef; --ink2:#a4adb8; --line:#333b45;
  --red:#ff6b7d; --red-soft:#3a1f25; --green:#5fcf8d; --green-soft:#1c3328;
  --amber:#f3b25a; --amber-soft:#3a2d16; --blue:#8fb6df; --blue-soft:#1e2c3a; --chip:#2a323b; --focus:#8fb6df; --pad:#fffdf5; --padline:#e4dfcc; }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 90px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header.top h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
header.top .who{font-size:13px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.seg{text-decoration:overline}
u{text-decoration:underline;text-underline-offset:3px}
section[hidden]{display:none}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.login{max-width:380px;margin:40px auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px}
.login h2{margin:0 0 6px;font-size:18px}
.login label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px}
input[type=text],input[type=password],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:1.2em}
.home .set{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.home .set h3{margin:0 0 4px;font-size:16px}
.home .past{font-size:13px;color:var(--ink2);margin:6px 0}
.home .past button{margin:2px 4px 2px 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px;font-size:14px;color:var(--ink2)}
.bar .timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-size:18px}
.q{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:12px 0}
.q .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.q .num{font-weight:700;font-size:16px}
.q .pts{font-size:12px;color:var(--ink2);background:var(--chip);padding:1px 8px;border-radius:99px}
.q .unit{font-size:12px;color:var(--ink2)}
.stem{font-family:"Noto Serif KR","Noto Sans KR",serif;font-size:15.5px;line-height:1.7}
.fig{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;margin:10px 0;text-align:center}
.fig svg{max-width:100%;max-height:230px;height:auto}
.box{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:14.5px}
.padwrap{margin:10px 0 4px}
.padbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-bottom:4px}
.padbar .tool{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:3px 9px;font:inherit;font-size:13px;cursor:pointer}
.padbar .tool[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
canvas.pad{display:block;width:100%;background:var(--pad);border:1px solid var(--padline);border-radius:8px;touch-action:none;cursor:crosshair;
  background-image:linear-gradient(var(--padline) 1px,transparent 1px);background-size:100% 28px}
canvas.pad.ro{cursor:default;touch-action:auto}
.choices{display:grid;gap:6px;margin-top:10px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 12px;border-radius:9px;font:inherit;font-size:15px;cursor:pointer;line-height:1.5}
.choice .c{font-weight:700;flex:0 0 1.4em}
.choice[aria-pressed="true"]{border-color:var(--ink);background:var(--chip);box-shadow:inset 0 0 0 1px var(--ink)}
.choice.ok{border-color:var(--green);background:var(--green-soft)}
.choice.bad{border-color:var(--red);background:var(--red-soft)}
.star{border:1px dashed var(--line);background:none;color:var(--ink2);border-radius:99px;padding:3px 10px;font:inherit;font-size:13px;cursor:pointer}
.star[aria-pressed="true"]{border-style:solid;border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.mark{font-weight:700} .mark.ok{color:var(--green)} .mark.bad{color:var(--red)}
.sticky-bottom{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:6}
.sticky-bottom .prog{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.score{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center}
.score .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.score .big small{font-size:16px;color:var(--ink2);font-weight:500}
.score .meta{font-size:14px;color:var(--ink2)}
.msg{font-size:14px;margin-top:6px}
.sol{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px;font-size:14.5px}
.sol ol{margin:4px 0 0 1.2em;padding:0}
.sol li{margin:4px 0}
.card{border-left:3px solid var(--amber);background:var(--amber-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0;font-size:14px}
.card.blue{border-color:var(--blue);background:var(--blue-soft)}
.card b{display:block;font-size:12px;letter-spacing:.06em;color:var(--ink2);margin-bottom:2px}
details summary{cursor:pointer;color:var(--blue);font-size:14px;font-weight:500;list-style:none}
details summary::before{content:"▸ "} details[open] summary::before{content:"▾ "}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--ink2)}
.chip.red{background:var(--red-soft);color:var(--red)} .chip.amber{background:var(--amber-soft);color:var(--amber)}
h2{font-size:17px;margin:20px 0 8px}
.note{font-size:13px;color:var(--ink2)}
white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace;max-height:280px;overflow:auto}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>

<div class="wrap">
<header class="top">
  <h1>모의고사</h1>
  <div class="who" id="who"></div>
</header>

<section id="loginView">
  <div class="login">
    <h2>로그인</h2>
    <div class="note">선생님이 알려준 이름과 암호를 넣어요.</div>
    <label for="inName">이름</label><input type="text" id="inName" autocomplete="off" inputmode="text">
    <label for="inPin">암호</label><input type="password" id="inPin" autocomplete="off" inputmode="numeric">
    <div class="err" id="loginErr"></div>
    <button class="btn primary" id="loginBtn" style="width:100%;margin-top:6px">들어가기</button>
  </div>
</section>

<section id="homeView" hidden><div class="home" id="homeBody"></div></section>

<section id="examView" hidden>
  <div class="bar"><span class="timer" id="timer">00:00</span><span class="note" id="examTitle"></span></div>
  <div class="note" style="margin-bottom:6px">연한 칸에 손가락이나 펜으로 풀이를 쓰고, 아래에서 답을 고른 뒤 맨 아래 <b>채점하기</b>. 막히면 ★를 누르고 어디서 막혔는지 한 줄 남겨요.</div>
  <div id="qlist"></div>
</section>

<section id="resultView" hidden><div id="resultBody"></div></section>
</div>

<div class="sticky-bottom" id="examBar" hidden>
  <span class="prog" id="prog">0 / 25 답함</span>
  <span><button class="btn ghost small" id="quitBtn">나중에</button> <button class="btn primary" id="submitBtn">채점하기</button></span>
</div>
<div class="toast" id="toast"></div>

th=\"url(#pda04bae0e8)\" style=\"fill: none; stroke: #1f2937; stroke-width: 1.4; stroke-linecap: round\"/> <\/g> <g id=\"line2d_6\"> <path d=\"M 15.78 107.51 L 148.71 18.89 \" clip-path=\"url(#pda04bae0e8)\" style=\"fill: none; stroke: #1f2937; stroke-width: 1.4; stroke-linecap: round\"/> <\/g> <g id=\"text_1\"> <text style=\"font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937\" x=\"58.98\" y=\"61.04\" transform=\"rotate(-0 58.98 61.04)\">6<\/text> <\/g> <g id=\"text_2\"> <text style=\"font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937\" x=\"55.66\" y=\"11.96\" transform=\"rotate(-0 55.66 11.96)\">A<\/text> <\/g> <g id=\"text_3\"> <text style=\"font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937\" x=\"153.14\" y=\"11.96\" transform=\"rotate(-0 153.14 11.96)\">D<\/text> <\/g> <g id=\"text_4\"> <text style=\"font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937\" x=\"9.14\" y=\"120.51\" transform=\"rotate(-0 9.14 120.51)\">B<\/text> <\/g> <g id=\"text_5\"> <text style=\"font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937\" x=\"199.66\" y=\"120.51\" transform=\"rotate(-0 199.66 120.51)\">C<\/text> <\/g> <g id=\"text_6\"> <text style=\"font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f2937\" x=\"104.4\" y=\"40.39\" transform=\"rotate(-0 104.4 40.39)\">O<\/text> <\/g> <g id=\"patch_2\"> <path d=\"M 104.4 49.76 C 104.75 49.76 105.09 49.62 105.34 49.37 C 105.59 49.12 105.73 48.78 105.73 48.43 C 105.73 48.08 105.59 47.74 105.34 47.49 C 105.09 47.24 104.75 47.1 104.4 47.1 C 104.05 47.1 103.71 47.24 103.46 47.49 C 103.21 47.74 103.07 48.08 103.07 48.43 C 103.07 48.78 103.21 49.12 103.46 49.37 C 103.71 49.62 104.05 49.76 104.4 49.76 z \" clip-path=\"url(#pda04bae0e8)\" style=\"fill: #1f2937; stroke: #1f2937; stroke-linejoin: miter\"/> <\/g> <\/g> <\/g> <defs> <clipPath id=\"pda04bae0e8\"> <rect x=\"3.6\" y=\"11.14\" width=\"201.6\" height=\"104.12\"/> <\/clipPath> <\/defs> <\/svg> "}, "sets": [{"id": 1, "title": "모의고사 1회 · 삼각형·사각형의 성질", "problems": [{"n": 1, "pts": 3, "unit": "iso", "fig": "q1", "stem": "다음 그림과 같이 <span class=\"seg\">AB<\/span> = <span class=\"seg\">AC<\/span>인 이등변삼각형 ABC에서 ∠A = 40°일 때, ∠C의 크기는?", "choices": ["50°", "60°", "65°", "70°", "80°"], "ans": 4, "sol": ["△ABC에서 AB = AC이므로 이등변삼각형이고, 이등변삼각형의 두 밑각의 크기는 같다. 따라서 ∠B = ∠C.", "삼각형의 세 내각의 합은 180°이므로 ∠A + ∠B + ∠C = 180°.", "∠A = 40°를 넣으면 ∠B + ∠C = 180° − 40° = 140°.", "∠B = ∠C이므로 ∠C = 140° ÷ 2 = 70°.", "물은 것은 ∠C 하나 → 70° (④)."], "trap": "140°를 답으로 쓰지 않기 — 두 밑각의 '합'과 '하나'를 구분. 답 쓰기 전에 \"∠C 하나만 물었지?\" 확인.", "concepts": ["iso-base", "anglesum"], "fb_wrong": "밑각 두 개의 합(140°)까지 가고 반으로 나누지 않았거나, 꼭지각 40°를 그대로 썼을 가능성이 커요. 그림에 ∠B = ∠C 표시부터.", "multi": false}, {"n": 2, "pts": 3, "unit": "iso", "stem": "다음 중 이등변삼각형에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["두 밑각의 크기는 서로 같다.", "꼭지각의 이등분선은 밑변을 수직이등분한다.", "두 내각의 크기가 같은 삼각형은 이등변삼각형이다.", "정삼각형은 이등변삼각형이다.", "이등변삼각형의 세 내각은 모두 예각이다."], "ans": 5, "sol": ["① 이등변삼각형의 두 밑각의 크기는 같다 — 성질 그대로. 옳다.", "② 꼭지각의 이등분선은 밑변을 수직이등분한다 — 성질 그대로. 옳다.", "③ 두 내각의 크기가 같으면 그 두 각을 밑각으로 하는 이등변삼각형이다 — 이등변삼각형이 되는 조건. 옳다.", "④ 정삼각형은 세 변이 모두 같으므로 두 변이 같은 삼각형(이등변삼각형)에 포함된다. 옳다.", "⑤ 꼭지각이 120°, 두 밑각이 30°인 이등변삼각형이 있다. 120°는 둔각이므로 '세 내각이 모두 예각'은 틀린 말이다.", "옳지 않은 것은 ⑤."], "trap": "'옳지 않은 것'에 밑줄 — 맞는 보기를 고르면 안 됨. 보기 옆에 O/X를 하나씩 쓰고 X가 하나만 남는지 확인.", "concepts": ["iso-base", "iso-bisect", "iso-conv"], "fb_wrong": "보기마다 O/X를 안 쓰고 눈으로만 읽으면 ①~④ 중 하나가 '이상하게' 보일 수 있어요. 반례(120°-30°-30°)를 떠올리면 ⑤가 바로 X.", "multi": false, "fig": null}, {"n": 3, "pts": 3, "unit": "iso", "fig": "q3", "stem": "다음 그림에서 <span class=\"seg\">AB<\/span> = <span class=\"seg\">AC<\/span>이고 ∠A = 36°이다. ∠B의 이등분선이 <span class=\"seg\">AC<\/span>와 만나는 점을 D라 할 때, ∠BDC의 크기는?", "choices": ["36°", "54°", "72°", "90°", "108°"], "ans": 3, "sol": ["AB = AC이므로 △ABC는 이등변삼각형이고 ∠B = ∠C.", "∠A = 36°이므로 ∠B + ∠C = 180° − 36° = 144°, 따라서 ∠B = ∠C = 72°.", "BD는 ∠B의 이등분선이므로 ∠ABD = ∠DBC = 72° ÷ 2 = 36°.", "점 D에서의 각 ∠BDC는 △DBC의 한 내각이다. △DBC의 세 각은 ∠DBC = 36°, ∠C = 72°, ∠BDC.", "∠BDC = 180° − 36° − 72° = 72° (③).", "(검산) ∠ADB는 ∠BDC의 보각이므로 108°이고, △ABD에서 36° + 36° + 108° = 180° ✓."], "trap": "∠ABD = 36°까지 구하고 멈추지 않기. 물은 건 ∠BDC(점 D에서의 각). 그림에 36, 36, 72 다 써넣고 마지막 삼각형 하나만 보면 끝.", "concepts": ["iso-base", "anglesum", "exterior"], "fb_wrong": "중간값(36°)에서 멈췄거나 ∠ADB(108°)를 답했을 가능성. 마지막에 '어느 각을 물었지?'를 한 번 더 보기.", "multi": false}, {"n": 4, "pts": 4, "unit": "iso", "fig": "q4", "stem": "다음 그림은 직사각형 모양의 종이 ABCD를 대각선 BD를 접는 선으로 하여 접은 것이다. 접힌 꼭짓점 A가 옮겨진 점을 A′, <span class=\"seg\">BA′<\/span>와 <span class=\"seg\">DC<\/span>가 만나는 점을 E라 하자. ∠ABD = 32°일 때, ∠BED의 크기는?", "choices": ["106°", "112°", "116°", "122°", "128°"], "ans": 3, "sol": ["종이를 BD를 따라 접었으므로, 접히기 전의 △ABD와 접힌 뒤의 △A′BD는 완전히 같은 모양이다. 따라서 ∠A′BD = ∠ABD = 32°. 점 E는 BA′ 위에 있으므로 ∠EBD = 32°.", "직사각형에서 <span class=\"seg\">AB<\/span> ∥ <span class=\"seg\">DC<\/span>이다. 평행선 AB, DC에 직선 BD가 만나므로 엇각이 같다: ∠BDC = ∠ABD = 32°. 점 E는 DC 위에 있으므로 ∠BDE = 32°.", "△EBD에서 ∠EBD = ∠EDB = 32°로 두 각이 같으므로 △EBD는 EB = ED인 이등변삼각형이다.", "△EBD의 세 내각의 합은 180°이므로 ∠BED = 180° − 32° − 32° = 116° (③)."], "trap": "접기 문제는 '접어서 같은 각' + '평행선 엇각' 두 개를 그림에 ● ● 로 찍으면 이등변삼각형이 보인다. 이게 안 보이면 못 푸는 문제.", "concepts": ["parallel", "iso-conv", "anglesum"], "fb_wrong": "패턴 A(평행선 + 같은 각 → 이등변)가 안 보인 것. ∠EBD = 32°와 ∠EDB = 32° 두 개를 그림에 찍고 '두 각이 같으면 이등변'을 소리 내서 말해 보기.", "multi": false}, {"n": 5, "pts": 3, "unit": "rt", "stem": "다음 중 두 직각삼각형이 서로 합동이 되는 조건이 <u>아닌<\/u> 것은?", "choices": ["빗변의 길이와 한 예각의 크기가 각각 같다.", "빗변의 길이와 다른 한 변의 길이가 각각 같다.", "두 예각의 크기가 각각 같다.", "직각을 낀 두 변의 길이가 각각 같다.", "한 변의 길이와 한 예각의 크기가 각각 같다."], "ans": 3, "sol": ["두 직각삼각형은 이미 직각 하나(R)가 같다.", "① 빗변(H)과 한 예각(A)이 같다 → RHA 합동. 조건이 된다.", "② 빗변(H)과 다른 한 변(S)이 같다 → RHS 합동. 조건이 된다.", "③ 두 예각만 같다 → 직각까지 세 각이 모두 같지만, 각만 같은 삼각형은 크기가 달라도 되므로(작은 것과 큰 것) 합동이 아니다. 조건이 아니다.", "④ 직각을 낀 두 변이 같다 → 두 변과 그 사이 각(직각)이 같으므로 SAS 합동. 조건이 된다.", "⑤ 한 변과 한 예각이 같다 → 직각 + 그 예각으로 나머지 각도 정해지므로 어느 변이든 '한 변과 양 끝 각'(ASA)이 된다. 조건이 된다.", "합동 조건이 아닌 것은 ③."], "trap": "합동 문제는 문제 옆에 SSS · SAS · ASA · RHA · RHS 를 먼저 다 써놓고 보기마다 어느 것에 해당하는지 표시. 각만 같은 건 절대 합동 아님.", "concepts": ["rt-cong", "congruence"], "fb_wrong": "⑤를 골랐다면 '직각이 이미 하나 있으니 예각 하나 더 = 각 두 개 = ASA'를 놓친 것. 합동 조건 5개를 옆에 써놓고 하나씩 대응시키는 습관.", "multi": false, "fig": null}, {"n": 6, "pts": 3, "unit": "rt", "fig": "q6", "stem": "다음 그림에서 ∠C = ∠F = 90°, <span class=\"seg\">AB<\/span> = <span class=\"seg\">DE<\/span> = 10 cm, ∠A = ∠D이고 <span class=\"seg\">AC<\/span> = 6 cm일 때, △ABC ≡ △DEF임을 보이는 합동 조건과 x의 값을 차례로 나열한 것은?", "choices": ["RHA 합동, x = 6", "RHA 합동, x = 8", "RHS 합동, x = 6", "RHS 합동, x = 8", "ASA 합동, x = 6"], "ans": 1, "sol": ["△ABC와 △DEF에서 ∠C = ∠F = 90° (직각, R).", "<span class=\"seg\">AB<\/span> = <span class=\"seg\">DE<\/span> = 10 cm이고, AB와 DE는 각각 직각의 대변이므로 빗변이다 (빗변, H).", "∠A = ∠D (한 예각, A).", "직각·빗변·한 예각이 각각 같으므로 RHA 합동: △ABC ≡ △DEF.", "합동인 도형에서 대응변의 길이는 같다. A ↔ D, B ↔ E, C ↔ F이므로 <span class=\"seg\">AC<\/span>의 대응변은 <span class=\"seg\">DF<\/span>. 따라서 x = <span class=\"seg\">AC<\/span> = 6 cm.", "답: RHA 합동, x = 6 (①)."], "trap": "R·H·A 세 글자를 그림에서 찾아서 표시: 직각 표시, 빗변 10, 예각 ●. 마지막 글자가 A(각)인지 S(변)인지가 이름을 결정.", "concepts": ["rt-cong"], "fb_wrong": "RHS와 RHA를 바꿔 썼다면 '빗변 + 각 = A, 빗변 + 변 = S'를 카드로 외우기. 진단에서도 같은 실수가 있었어요.", "multi": false}, {"n": 7, "pts": 4, "unit": "rt", "fig": "q7", "stem": "다음 그림과 같이 ∠C = 90°인 직각삼각형 ABC에서 ∠A의 이등분선이 <span class=\"seg\">BC<\/span>와 만나는 점을 D, 점 D에서 <span class=\"seg\">AB<\/span>에 내린 수선의 발을 E라 하자. <span class=\"seg\">AB<\/span> = 10 cm, <span class=\"seg\">DC<\/span> = 3 cm일 때, △ABD의 넓이는?", "choices": ["12 cm²", "15 cm²", "18 cm²", "20 cm²", "24 cm²"], "ans": 2, "sol": ["△ADC와 △ADE에서 ∠ACD = ∠AED = 90° (R), <span class=\"seg\">AD<\/span>는 공통이므로 빗변이 같다 (H), AD가 ∠A의 이등분선이므로 ∠DAC = ∠DAE (A).", "따라서 △ADC ≡ △ADE (RHA 합동)이고, 대응변 <span class=\"seg\">DE<\/span> = <span class=\"seg\">DC<\/span> = 3 cm. (각의 이등분선 위의 점은 두 변까지의 거리가 같다는 성질과 같은 말.)", "△ABD에서 <span class=\"seg\">DE<\/span> ⊥ <span class=\"seg\">AB<\/span>이므로, 밑변을 <span class=\"seg\">AB<\/span>로 보면 높이는 <span class=\"seg\">DE<\/span>이다.", "넓이 = ½ × 밑변 × 높이 = ½ × 10 × 3 = 15 cm² (②)."], "trap": "'각의 이등분선 위의 점은 두 변까지 거리가 같다'를 그림에서 DE = DC = 3으로 바로 옮겨 적기. △ABD의 높이는 DE(수선)라는 걸 그림에서 확인.", "concepts": ["bisector-prop", "rt-cong", "area"], "fb_wrong": "DE = DC를 못 봤거나 높이를 BC 쪽으로 잡았을 가능성. '이등분선 + 수선 두 개'가 보이면 RHA 합동 → 같은 길이, 이 한 줄로 끝.", "multi": false}, {"n": 8, "pts": 3, "unit": "circ", "stem": "삼각형의 외심에 대한 설명으로 옳지 <u>않은<\/u> 것은?", "choices": ["세 변의 수직이등분선의 교점이다.", "세 꼭짓점에 이르는 거리가 모두 같다.", "둔각삼각형의 외심은 삼각형의 외부에 있다.", "직각삼각형의 외심은 빗변의 중점이다.", "외심에서 세 변에 이르는 거리는 모두 같다."], "ans": 5, "sol": ["외심은 세 변의 수직이등분선의 교점이다. ① 옳다.", "수직이등분선 위의 점은 선분의 양 끝점에서 같은 거리에 있으므로, 외심은 세 꼭짓점에서 같은 거리(외접원의 반지름)에 있다. ② 옳다.", "외심의 위치는 예각삼각형이면 내부, 직각삼각형이면 빗변의 중점, 둔각삼각형이면 외부. ③, ④ 옳다.", "'세 변에 이르는 거리가 같다'는 각의 이등분선의 교점, 즉 내심의 성질이다. ⑤가 틀렸다."], "trap": "외심 ↔ 꼭짓점(점), 내심 ↔ 변(선). '외심은 꼭짓점, 내심은 변' 이 한 줄이면 이런 문제는 5초.", "concepts": ["circum", "incenter"], "fb_wrong": "외심과 내심의 정의가 섞인 것. 카드: 외심 = 수직이등분선 = 꼭짓점 거리 같음 / 내심 = 각 이등분선 = 변 거리 같음.", "multi": false, "fig": null}, {"n": 9, "pts": 4, "unit": "circ", "fig": "q9", "stem": "다음 그림에서 점 O는 △ABC의 외심이다. ∠OBA = 25°, ∠OCA = 35°일 때, ∠BOC의 크기는?", "choices": ["100°", "110°", "120°", "130°", "140°"], "ans": 3, "sol": ["O는 외심이므로 <span class=\"seg\">OA<\/span> = <span class=\"seg\">OB<\/span> = <span class=\"seg\">OC<\/span> (외접원의 반지름).", "△OAB는 <span class=\"seg\">OA<\/span> = <span class=\"seg\">OB<\/span>인 이등변삼각형이므로 ∠OAB = ∠OBA = 25°.", "△OCA는 <span class=\"seg\">OA<\/span> = <span class=\"seg\">OC<\/span>인 이등변삼각형이므로 ∠OAC = ∠OCA = 35°.", "∠A = ∠OAB + ∠OAC = 25° + 35° = 60°.", "외심의 성질: ∠BOC = 2∠A = 2 × 60° = 120° (③).", "(검산) ∠OBC = ∠OCB = 90° − 25° − 35° = 30°이고, △OBC에서 180° − 30° − 30° = 120° ✓."], "trap": "외심 문제 두 공식: ① ∠BOC = 2∠A, ② x + y + z = 90°. 주어진 각이 꼭짓점 쪽(∠OBA 등)이면 ②로 세 번째 각을 먼저 채우거나, ∠A를 만들어 ①.", "concepts": ["circum-angle", "iso-base"], "fb_wrong": "∠A = 60°를 그대로 답했거나(중간값), 2배를 안 했을 수 있어요. 외심 → OA = OB = OC 세 이등변삼각형을 그림에 표시하는 게 시작.", "multi": false}, {"n": 10, "pts": 4, "unit": "circ", "fig": "q10", "stem": "다음 그림과 같이 ∠C = 90°인 직각삼각형 ABC에서 점 O는 <span class=\"seg\">AB<\/span>의 중점이다. <span class=\"seg\">AB<\/span> = 12 cm, ∠A = 32°일 때, <span class=\"seg\">OC<\/span>의 길이와 ∠BOC의 크기를 차례로 나열한 것은?", "choices": ["6 cm, 58°", "6 cm, 64°", "6 cm, 116°", "12 cm, 64°", "12 cm, 116°"], "ans": 2, "sol": ["∠C = 90°인 직각삼각형의 외심은 빗변 AB의 중점이다. O가 AB의 중점이므로 O는 외심.", "따라서 <span class=\"seg\">OA<\/span> = <span class=\"seg\">OB<\/span> = <span class=\"seg\">OC<\/span> = ½ × <span class=\"seg\">AB<\/span> = 12 ÷ 2 = 6 cm.", "△OCA는 <span class=\"seg\">OA<\/span> = <span class=\"seg\">OC<\/span>인 이등변삼각형이므로 ∠OCA = ∠OAC = 32°.", "∠BOC는 △OCA에서 꼭짓점 O의 외각이다. 삼각형의 한 외각의 크기는 이웃하지 않는 두 내각의 합과 같으므로 ∠BOC = ∠OAC + ∠OCA = 32° + 32° = 64°.", "답: 6 cm, 64° (②). (∠AOC = 180° − 64° = 116°는 다른 각이므로 ③은 오답.)"], "trap": "'빗변의 중점'이라고 쓰여 있으면 외심 문제. OC를 그리면 이등변삼각형 두 개. ∠AOC(116°)를 물었는지 ∠BOC(64°)를 물었는지 마지막에 확인.", "concepts": ["rt-circum", "iso-base", "exterior"], "fb_wrong": "③(116°)을 골랐다면 각의 위치를 잘못 본 것 — 진단 ①-5에서도 있었던 실수. 물어본 각에 동그라미 치고 시작.", "multi": false}, {"n": 11, "pts": 4, "unit": "inc", "multi": true, "stem": "삼각형의 외심 O와 내심 I에 대한 설명으로 옳은 것을 <u>두 개<\/u> 고르면?", "choices": ["내심은 세 내각의 이등분선의 교점이다.", "내심에서 세 꼭짓점에 이르는 거리는 모두 같다.", "정삼각형의 외심과 내심은 일치한다.", "직각삼각형의 내심은 빗변의 중점이다.", "둔각삼각형의 내심은 삼각형의 외부에 있다."], "ans": [1, 3], "sol": ["① 내심은 세 내각의 이등분선의 교점이다 — 정의. 옳다.", "② 세 꼭짓점에 이르는 거리가 같은 점은 외심이다. 내심은 세 변에 이르는 거리가 같다. 틀리다.", "③ 정삼각형에서는 각 변의 수직이등분선이 마주보는 각의 이등분선과 같은 직선이므로 외심과 내심이 한 점이다. 옳다.", "④ 빗변의 중점은 직각삼각형의 외심이지 내심이 아니다. 틀리다.", "⑤ 내심은 어떤 삼각형에서도 항상 내부에 있다(둔각삼각형에서 외부에 있는 것은 외심). 틀리다.", "옳은 것은 ①, ③."], "trap": "'두 개 고르면' → 반드시 두 개 마킹(1학기 18번에서 놓친 유형). 보기 옆에 O/X 다 쓰고 O가 정확히 2개인지 세기.", "concepts": ["incenter", "circum", "rt-circum"], "fb_wrong": "하나만 골랐거나 ④를 골랐을 가능성. '빗변의 중점'은 외심, '항상 내부'는 내심. 두 개를 다 맞혀야 정답.", "fig": null}, {"n": 12, "pts": 4, "unit": "inc", "fig": "q12", "stem": "다음 그림에서 점 I는 △ABC의 내심이다. ∠IBA = 24°, ∠ICB = 30°일 때, ∠BIC의 크기는?", "choices": ["116°", "120°", "126°", "130°", "132°"], "ans": 3, "sol": ["I는 내심이므로 BI는 ∠B의 이등분선, CI는 ∠C의 이등분선이다.", "∠IBC = ∠IBA = 24°, ∠ICB = 30°.", "△IBC의 세 내각의 합은 180°이므로 ∠BIC = 180° − ∠IBC − ∠ICB = 180° − 24° − 30° = 126° (③).", "(다른 방법) ∠B = 2 × 24° = 48°, ∠C = 2 × 30° = 60°, ∠A = 180° − 48° − 60° = 72°. 내심의 성질 ∠BIC = 90° + ½∠A = 90° + 36° = 126° ✓."], "trap": "내심 공식 ∠BIC = 90° + ½∠A 는 ∠A가 주어졌을 때. 이 문제처럼 밑각 쪽이 주어지면 그냥 이등분 + 삼각형 내각의 합이 더 빠르다. 두 방법으로 검산.", "concepts": ["incenter-angle", "anglesum"], "fb_wrong": "24°를 이등분된 반쪽으로 안 보고 ∠B 전체로 착각하면 틀려요. '내심 = 각을 반으로'를 그림에 ● ● 표시부터.", "multi": false}, {"n": 13, "pts": 4, "unit": "inc", "fig": "q13", "stem": "다음 그림에서 △ABC의 내접원 I가 세 변 <span class=\"seg\">AB<\/span>, <span class=\"seg\">BC<\/span>, <span class=\"seg\">CA<\/span>와 접하는 점을 각각 D, E, F라 하자. <span class=\"seg\">AB<\/span> = 9 cm, <span class=\"seg\">BC<\/span> = 10 cm, <span class=\"seg\">CA<\/span> = 7 cm일 때, <span class=\"seg\">AD<\/span>의 길이는?", "choices": ["2 cm", "3 cm", "4 cm", "5 cm", "6 cm"], "ans": 2, "sol": ["원 밖의 한 점에서 그 원에 그은 두 접선의 길이는 같다. 접점 D, E, F에 대해 AD = AF, BD = BE, CE = CF.", "<span class=\"seg\">AD<\/span> = x라 하면 <span class=\"seg\">AF<\/span> = x.", "<span class=\"seg\">BD<\/span> = <span class=\"seg\">AB<\/span> − <span class=\"seg\">AD<\/span> = 9 − x, 따라서 <span class=\"seg\">BE<\/span> = 9 − x.", "<span class=\"seg\">CF<\/span> = <span class=\"seg\">CA<\/span> − <span class=\"seg\">AF<\/span> = 7 − x, 따라서 <span class=\"seg\">CE<\/span> = 7 − x.", "<span class=\"seg\">BC<\/span> = <span class=\"seg\">BE<\/span> + <span class=\"seg\">EC<\/span> 이므로 (9 − x) + (7 − x) = 10.", "16 − 2x = 10, −2x = −6, x = 3. 따라서 AD = 3 cm (②).", "(검산) BD = BE = 6, CE = CF = 4, BE + EC = 6 + 4 = 10 = BC ✓."], "trap": "접선 길이는 '같은 색으로 칠하기'까지 하고 식을 안 세우는 게 진단 때 막힌 지점. 색칠 다음 줄에 바로 (9−x)+(7−x)=10 을 쓰는 것까지가 한 세트.", "concepts": ["incircle"], "fb_wrong": "같은 길이 표시는 됐는데 x를 놓고 식을 세우는 단계에서 멈춘 것(진단 ②-3과 같은 지점). 공식: AD = (AB + CA − BC) ÷ 2 = (9+7−10)÷2 = 3.", "multi": false}, {"n": 14, "pts": 4, "unit": "inc", "fig": "q14", "stem": "다음 그림과 같이 ∠C = 90°인 직각삼각형 ABC에서 <span class=\"seg\">AB<\/span> = 10 cm, <span class=\"seg\">BC<\/span> = 8 cm, <span class=\"seg\">CA<\/span> = 6 cm이다. △ABC의 내접원의 반지름의 길이는?", "choices": ["1 cm", "1.5 cm", "2 cm", "2.5 cm", "3 cm"], "ans": 3, "sol": ["∠C = 90°이므로 △ABC의 넓이는 직각을 낀 두 변으로 구한다: ½ × <span class=\"seg\">CA<\/span> × <span class=\"seg\">BC<\/span> = ½ × 6 × 8 = 24 cm².", "내접원의 중심 I에서 세 변에 이르는 거리는 모두 반지름 r이다. 그래서 △ABC = △IAB + △IBC + △ICA = ½·10·r + ½·8·r + ½·6·r = ½ r (10 + 8 + 6) = 12r.", "12r = 24 → r = 2 cm (③).", "(다른 방법) 직각삼각형에서 r = (직각을 낀 두 변의 합 − 빗변) ÷ 2 = (6 + 8 − 10) ÷ 2 = 2 ✓."], "trap": "½ r × (둘레) = 넓이. 진단 때 '밑변 × 높이'로 착각했던 공식. 둘레 24를 먼저 따로 쓰고 시작.", "concepts": ["incircle", "area"], "fb_wrong": "넓이 24는 맞았는데 r을 12로 나누지 않았거나, 14×r = 84 같은 엉뚱한 식(진단 ②-3(1))이면 공식 카드부터.", "multi": false}, {"n": 15, "pts": 4, "unit": "inc", "fig": "q15", "stem": "다음 그림에서 점 I는 △ABC의 내심이고, <span class=\"seg\">DE<\/span> ∥ <span class=\"seg\">BC<\/span>이다. <span class=\"seg\">AB<\/span> = 9 cm, <span class=\"seg\">AC<\/span> = 6 cm, <span class=\"seg\">AD<\/span> = 6 cm, <span class=\"seg\">AE<\/span> = 4 cm일 때, <span class=\"seg\">DE<\/span>의 길이는?", "choices": ["4 cm", "5 cm", "6 cm", "7 cm", "8 cm"], "ans": 2, "sol": ["I는 내심이므로 BI는 ∠B의 이등분선: ∠DBI = ∠IBC.", "<span class=\"seg\">DE<\/span> ∥ <span class=\"seg\">BC<\/span>이고 BI가 두 평행선과 만나므로 엇각이 같다: ∠DIB = ∠IBC.", "따라서 ∠DBI = ∠DIB. 두 각이 같으므로 △DBI는 <span class=\"seg\">DI<\/span> = <span class=\"seg\">DB<\/span>인 이등변삼각형. <span class=\"seg\">DB<\/span> = <span class=\"seg\">AB<\/span> − <span class=\"seg\">AD<\/span> = 9 − 6 = 3이므로 <span class=\"seg\">DI<\/span> = 3.", "같은 방법으로 CI는 ∠C의 이등분선이고 엇각 ∠EIC = ∠ICB이므로 △EIC는 <span class=\"seg\">IE<\/span> = <span class=\"seg\">EC<\/span>인 이등변삼각형. <span class=\"seg\">EC<\/span> = <span class=\"seg\">AC<\/span> − <span class=\"seg\">AE<\/span> = 6 − 4 = 2이므로 <span class=\"seg\">IE<\/span> = 2.", "<span class=\"seg\">DE<\/span> = <span class=\"seg\">DI<\/span> + <span class=\"seg\">IE<\/span> = 3 + 2 = 5 cm (②).", "(검산) △ADE의 둘레 = <span class=\"seg\">AD<\/span> + <span class=\"seg\">DE<\/span> + <span class=\"seg\">EA<\/span> = 6 + 5 + 4 = 15 = <span class=\"seg\">AB<\/span> + <span class=\"seg\">AC<\/span> ✓."], "trap": "'왜 DI = DB인가'를 말로 설명할 수 있어야 함 — 각의 이등분선 + 평행선 엇각 → 이등변. 공식만 외우면 그림이 조금 바뀔 때 무너진다.", "concepts": ["incenter-par", "parallel", "iso-conv"], "fb_wrong": "공식(둘레 = AB + AC)만 외웠다면 DE 하나만 물었을 때 막힐 수 있어요. DI = DB, IE = EC 두 이등변을 그림에 표시하는 연습.", "multi": false}, {"n": 16, "pts": 3, "unit": "pg", "fig": "q16", "stem": "다음 그림과 같은 평행사변형 ABCD에서 ∠A = 65°, <span class=\"seg\">AB<\/span> = 6 cm, <span class=\"seg\">AD<\/span> = 9 cm일 때, ∠D의 크기와 <span class=\"seg\">BC<\/span>의 길이를 차례로 나열한 것은?", "choices": ["65°, 6 cm", "65°, 9 cm", "115°, 6 cm", "115°, 9 cm", "125°, 9 cm"], "ans": 4, "sol": ["평행사변형에서 이웃하는 두 각의 합은 180°이다. ∠A와 ∠D는 변 AD를 공유하는 이웃한 각이므로 ∠D = 180° − 65° = 115°. (∠C는 ∠A의 대각이라 65°로 같다 — 묻는 것은 ∠D.)", "평행사변형에서 두 쌍의 대변의 길이는 각각 같다. <span class=\"seg\">BC<\/span>의 대변은 <span class=\"seg\">AD<\/span>이므로 <span class=\"seg\">BC<\/span> = <span class=\"seg\">AD<\/span> = 9 cm. (<span class=\"seg\">AB<\/span> = 6 cm은 <span class=\"seg\">DC<\/span>와 같다.)", "답: 115°, 9 cm (④)."], "trap": "∠C(대각 = 65°)와 ∠D(이웃각 = 115°)를 구분. 물어본 꼭짓점 글자에 동그라미.", "concepts": ["pgram"], "fb_wrong": "②를 골랐다면 대각(∠C)과 이웃각(∠D)을 헷갈린 것. 평행사변형은 '마주보면 같고, 이웃하면 180°'.", "multi": false}, {"n": 17, "pts": 4, "unit": "pg", "fig": "q17", "stem": "다음 그림과 같은 평행사변형 ABCD에서 두 대각선의 교점을 O라 하자. <span class=\"seg\">AC<\/span> = 14 cm, <span class=\"seg\">BD<\/span> = 10 cm, <span class=\"seg\">AB<\/span> = 7 cm일 때, △OAB의 둘레의 길이는?", "choices": ["17 cm", "18 cm", "19 cm", "20 cm", "21 cm"], "ans": 3, "sol": ["평행사변형의 두 대각선은 서로 다른 것을 이등분한다. 따라서 <span class=\"seg\">OA<\/span> = ½ × <span class=\"seg\">AC<\/span> = 14 ÷ 2 = 7 cm, <span class=\"seg\">OB<\/span> = ½ × <span class=\"seg\">BD<\/span> = 10 ÷ 2 = 5 cm.", "△OAB의 둘레 = <span class=\"seg\">OA<\/span> + <span class=\"seg\">OB<\/span> + <span class=\"seg\">AB<\/span> = 7 + 5 + 7 = 19 cm (③)."], "trap": "대각선 전체 길이를 그대로 더하지 않기(14 + 10 + 7 = 31 ✗). '이등분'이니까 반으로 나눠 그림에 7, 5 써넣기.", "concepts": ["pgram"], "fb_wrong": "대각선 길이를 반으로 안 나눴거나(31), OA·OB만 더했을(12) 가능성. 둘레 = 세 변 전부.", "multi": false}, {"n": 18, "pts": 4, "unit": "pg", "stem": "다음 중 □ABCD가 항상 평행사변형이 되는 것은? (단, 점 O는 두 대각선의 교점이다.)", "choices": ["<span class=\"seg\">AB<\/span> ∥ <span class=\"seg\">DC<\/span>, <span class=\"seg\">AD<\/span> = <span class=\"seg\">BC<\/span>", "<span class=\"seg\">AB<\/span> = <span class=\"seg\">BC<\/span>, <span class=\"seg\">CD<\/span> = <span class=\"seg\">DA<\/span>", "<span class=\"seg\">OA<\/span> = <span class=\"seg\">OC<\/span>, <span class=\"seg\">OB<\/span> = <span class=\"seg\">OD<\/span>", "<span class=\"seg\">OA<\/span> = <span class=\"seg\">OB<\/span>, <span class=\"seg\">OC<\/span> = <span class=\"seg\">OD<\/span>", "∠A = ∠B, ∠C = ∠D"], "ans": 3, "sol": ["평행사변형이 되는 조건 5가지: (1) 두 쌍의 대변이 각각 평행 (2) 두 쌍의 대변의 길이가 각각 같다 (3) 두 쌍의 대각의 크기가 각각 같다 (4) 두 대각선이 서로 다른 것을 이등분한다 (5) 한 쌍의 대변이 평행하고 그 길이가 같다.", "① <span class=\"seg\">AB<\/span> ∥ <span class=\"seg\">DC<\/span>이지만 길이가 같은 것은 다른 쌍 <span class=\"seg\">AD<\/span> = <span class=\"seg\">BC<\/span>이다. 위아래가 평행하고 옆 두 변이 같은 등변사다리꼴도 이 조건을 만족하므로 항상 평행사변형은 아니다.", "② <span class=\"seg\">AB<\/span> = <span class=\"seg\">BC<\/span>, <span class=\"seg\">CD<\/span> = <span class=\"seg\">DA<\/span>는 이웃한 변끼리 같은 것이다. 연(kite) 모양이 되므로 평행사변형이 아니다.", "③ <span class=\"seg\">OA<\/span> = <span class=\"seg\">OC<\/span>, <span class=\"seg\">OB<\/span> = <span class=\"seg\">OD<\/span>는 두 대각선이 서로 다른 것을 이등분한다는 뜻이다 → 조건 (4). 항상 평행사변형이 된다.", "④ <span class=\"seg\">OA<\/span> = <span class=\"seg\">OB<\/span>, <span class=\"seg\">OC<\/span> = <span class=\"seg\">OD<\/span>는 두 대각선의 길이가 같다는 뜻일 뿐, 이등분과 다르다. 등변사다리꼴이 될 수 있다.", "⑤ ∠A = ∠B, ∠C = ∠D는 이웃한 각끼리 같은 것이다. 등변사다리꼴(또는 직사각형)이 될 수 있으므로 항상은 아니다.", "항상 평행사변형이 되는 것은 ③."], "trap": "'한 쌍의 대변이 평행하고 그 길이가 같다'는 반드시 같은 쌍! ①처럼 평행은 AB·DC, 같은 건 AD·BC이면 안 됨. 진단 ③-4에서 막혔던 바로 그 지점.", "concepts": ["pgram-cond", "trapezoid"], "fb_wrong": "①을 골랐다면 '같은 쌍' 조건을 놓친 것. 등변사다리꼴 그림을 옆에 그려서 ①이 왜 안 되는지 눈으로 확인.", "multi": false, "fig": null}, {"n": 19, "pts": 5, "unit": "quad", "stem": "다음 보기 중 옳은 것을 모두 고른 것은?", "box": ["ㄱ. 이웃하는 두 변의 길이가 같은 평행사변형은 마름모이다.", "ㄴ. 두 대각선이 서로 수직인 평행사변형은 직사각형이다.", "ㄷ. 두 대각선의 길이가 같은 마름모는 정사각형이다.", "ㄹ. 한 내각의 크기가 90°인 마름모는 정사각형이다.", "ㅁ. 두 대각선의 길이가 같은 사각형은 직사각형이다."], "choices": ["ㄱ, ㄴ", "ㄱ, ㄷ", "ㄱ, ㄷ, ㄹ", "ㄴ, ㄷ, ㅁ", "ㄱ, ㄷ, ㄹ, ㅁ"], "ans": 3, "sol": ["ㄱ. 마름모는 네 변의 길이가 같은 사각형. 평행사변형은 대변이 같으므로 이웃한 두 변만 같으면 네 변이 다 같아진다. 옳다.", "ㄴ. 두 대각선이 서로 수직인 평행사변형은 마름모이다. 직사각형이 되는 조건은 '대각선의 길이가 같다'. 틀리다.", "ㄷ. 마름모는 이미 평행사변형이고, 평행사변형에 '두 대각선의 길이가 같다'를 더하면 직사각형이 된다. 마름모이면서 직사각형이면 정사각형. 옳다.", "ㄹ. 마름모(평행사변형)에 '한 내각이 직각'을 더하면 직사각형 → 마름모이면서 직사각형이므로 정사각형. 옳다.", "ㅁ. 등변사다리꼴은 두 대각선의 길이가 같지만 직사각형이 아니다. '사각형'이 아니라 '평행사변형'이어야 성립한다. 틀리다.", "옳은 것은 ㄱ, ㄷ, ㄹ (③)."], "trap": "평행사변형 → 직사각형: 한 각이 직각 / 대각선 길이 같음. 평행사변형 → 마름모: 이웃 변 같음 / 대각선 수직. 출발이 '평행사변형'인지 '사각형'인지 꼭 확인(ㅁ 함정).", "concepts": ["rect", "rhombus", "square", "quad-map", "trapezoid"], "fb_wrong": "ㅁ을 O로 봤다면 '사각형 vs 평행사변형' 출발점 함정. ㄴ을 O로 봤다면 수직(마름모)과 길이 같음(직사각형)이 바뀐 것.", "multi": false, "fig": null}, {"n": 20, "pts": 5, "unit": "rt", "fig": "q20", "stem": "다음 그림과 같이 ∠A = 90°이고 <span class=\"seg\">AB<\/span> = <span class=\"seg\">AC<\/span>인 직각이등변삼각형 ABC의 꼭짓점 A를 지나는 직선 ℓ 위에 두 꼭짓점 B, C에서 내린 수선의 발을 각각 D, E라 하자. <span class=\"seg\">BD<\/span> = 6 cm, <span class=\"seg\">CE<\/span> = 9 cm일 때, <span class=\"seg\">DE<\/span>의 길이는?", "choices": ["12 cm", "13 cm", "14 cm", "15 cm", "16 cm"], "ans": 4, "sol": ["∠BAC = 90°이므로 직선 ℓ 위에서 ∠DAB + ∠EAC = 180° − 90° = 90°.", "△DBA는 ∠ADB = 90°인 직각삼각형이므로 ∠DBA + ∠DAB = 90°.", "두 식에서 ∠DBA = 90° − ∠DAB = ∠EAC. 즉 ∠DBA = ∠EAC.", "△DBA와 △EAC에서 ∠BDA = ∠AEC = 90° (R), <span class=\"seg\">BA<\/span> = <span class=\"seg\">AC<\/span> (빗변, H), ∠DBA = ∠EAC (A) → RHA 합동, △DBA ≡ △EAC.", "대응 순서 D ↔ E, B ↔ A, A ↔ C이므로 <span class=\"seg\">DA<\/span> ↔ <span class=\"seg\">EC<\/span>, <span class=\"seg\">DB<\/span> ↔ <span class=\"seg\">EA<\/span>. 따라서 <span class=\"seg\">DA<\/span> = <span class=\"seg\">EC<\/span> = 9 cm, <span class=\"seg\">AE<\/span> = <span class=\"seg\">BD<\/span> = 6 cm.", "<span class=\"seg\">DE<\/span> = <span class=\"seg\">DA<\/span> + <span class=\"seg\">AE<\/span> = 9 + 6 = 15 cm (④)."], "trap": "'직각이등변 + 수선 두 개' = RHA 합동 세트. 합동 조건 5개를 옆에 써놓고 R, H, A를 그림에서 찾기. 합동이면 DE = BD + CE.", "concepts": ["rt-cong", "anglesum"], "fb_wrong": "합동인 두 삼각형을 못 찾았거나, 대응변을 반대로(DA = BD) 잡았을 가능성. 대응 꼭짓점 순서 D→E, B→A, A→C를 써놓고 대응변 읽기.", "multi": false}, {"n": 21, "pts": 5, "unit": "quad", "fig": "q21", "stem": "다음 그림과 같은 정사각형 ABCD에서 대각선 BD 위에 점 E를 잡았다. ∠DCE = 20°일 때, ∠AEB의 크기는?", "choices": ["55°", "60°", "65°", "70°", "75°"], "ans": 3, "sol": ["정사각형의 대각선은 각 내각을 이등분한다. 대각선 BD는 ∠B = 90°를 이등분하므로 ∠ABE = ∠CBE = 45°.", "△ABE와 △CBE에서 <span class=\"seg\">AB<\/span> = <span class=\"seg\">CB<\/span> (정사각형의 변, S), ∠ABE = ∠CBE = 45° (A), <span class=\"seg\">BE<\/span>는 공통 (S) → SAS 합동, △ABE ≡ △CBE.", "∠DCE = 20°이고 ∠BCD = 90°이므로 ∠BCE = 90° − 20° = 70°.", "합동에서 대응각 ∠BAE = ∠BCE = 70°.", "△ABE의 세 내각의 합: ∠AEB = 180° − ∠ABE − ∠BAE = 180° − 45° − 70° = 65° (③)."], "trap": "정사각형 대각선 위의 점 → 45° 두 개 + 공통변 → SAS 합동. 합동 조건 5개를 써놓고 S·A·S 세 개를 그림에서 찾기. 물은 각이 ∠AEB인지 ∠BEC인지 확인.", "concepts": ["square", "congruence", "anglesum"], "fb_wrong": "∠BCE = 70°까지 갔는데 합동으로 ∠BAE로 못 옮겼거나, 45°를 안 쓰고 90°로 계산했을 가능성. '대각선 = 45°'가 정사각형의 핵심.", "multi": false}, {"n": 22, "pts": 5, "unit": "pg", "fig": "q22", "stem": "다음 그림과 같은 평행사변형 ABCD에서 ∠A의 이등분선이 <span class=\"seg\">BC<\/span>와 만나는 점을 E, ∠D의 이등분선이 <span class=\"seg\">BC<\/span>와 만나는 점을 F라 하자. <span class=\"seg\">AB<\/span> = 6 cm, <span class=\"seg\">AD<\/span> = 10 cm일 때, <span class=\"seg\">EF<\/span>의 길이는?", "choices": ["1 cm", "2 cm", "3 cm", "4 cm", "5 cm"], "ans": 2, "sol": ["AE는 ∠A의 이등분선이므로 ∠BAE = ∠EAD.", "평행사변형에서 <span class=\"seg\">AD<\/span> ∥ <span class=\"seg\">BC<\/span>이고 AE가 두 평행선과 만나므로 엇각 ∠EAD = ∠AEB.", "따라서 ∠BAE = ∠AEB. 두 각이 같으므로 △BAE는 <span class=\"seg\">BE<\/span> = <span class=\"seg\">BA<\/span> = 6 cm인 이등변삼각형.", "같은 방법으로 DF는 ∠D의 이등분선이므로 ∠ADF = ∠FDC, 엇각 ∠ADF = ∠DFC → ∠FDC = ∠DFC → △CDF는 <span class=\"seg\">CF<\/span> = <span class=\"seg\">CD<\/span>인 이등변삼각형. 평행사변형의 대변 <span class=\"seg\">CD<\/span> = <span class=\"seg\">AB<\/span> = 6 cm이므로 <span class=\"seg\">CF<\/span> = 6 cm.", "<span class=\"seg\">BC<\/span> = <span class=\"seg\">AD<\/span> = 10 cm. 점 F는 B에서 10 − 6 = 4 cm, 점 E는 B에서 6 cm 위치에 있으므로 <span class=\"seg\">EF<\/span> = 6 − 4 = 2 cm (②). (식으로: BE + CF − BC = 6 + 6 − 10 = 2.)"], "trap": "패턴 A의 대표 문제: 이등분선 + 평행선 → 이등변. 진단 ③-3에서 별표 쳤던 유형. 그림에 ● ● ● 세 개 찍기 → 'BE = AB' 소리 내서 말하기.", "concepts": ["parallel", "iso-conv", "pgram"], "fb_wrong": "시작을 못 했다면 패턴 A 연습이 더 필요. BE = 6, CF = 6까지 갔는데 EF = 2를 못 냈다면 겹치는 부분(6 + 6 − 10)을 그림에 표시.", "multi": false}, {"n": 23, "pts": 5, "unit": "pg", "fig": "q23", "stem": "다음 그림과 같이 평행사변형 ABCD의 내부의 한 점 P에 대하여 △PAB = 12 cm², △PCD = 18 cm², △PDA = 10 cm²일 때, △PBC의 넓이는?", "choices": ["16 cm²", "18 cm²", "20 cm²", "22 cm²", "24 cm²"], "ans": 3, "sol": ["평행사변형 ABCD의 내부의 점 P에서 네 꼭짓점을 이으면 삼각형 4개가 생긴다. △PAB와 △PCD는 밑변 AB, CD가 같고, 두 높이의 합이 평행사변형의 높이와 같으므로 △PAB + △PCD = ½ × □ABCD. 마찬가지로 △PBC + △PDA = ½ × □ABCD.", "□ABCD = 2 × (△PAB + △PCD) = 2 × (12 + 18) = 60 cm².", "△PBC + △PDA = 60 ÷ 2 = 30 cm².", "△PBC = 30 − △PDA = 30 − 10 = 20 cm² (③).", "(검산) 12 + 18 = 30, 10 + 20 = 30 ✓. 마주보는 두 삼각형은 '같은' 것이 아니라 '합이 같다'."], "trap": "마주보는 두 삼각형은 '같은 게' 아니라 '합이 절반'. 진단 ③-5에서 '같다'고 생각해 틀렸음. 답 낸 뒤 12 + 18 = 10 + 20 = 30 검산.", "concepts": ["pgram-area"], "fb_wrong": "'마주보는 삼각형은 넓이가 같다'로 풀었다면 개념 교정 필요. 반드시 합으로 검산: 12+18 = 30, 10+? = 30.", "multi": false}, {"n": 24, "pts": 5, "unit": "area", "fig": "q24", "stem": "다음 그림과 같이 □ABCD에서 <span class=\"seg\">BC<\/span>의 연장선 위의 점 E에 대하여 <span class=\"seg\">AC<\/span> ∥ <span class=\"seg\">DE<\/span>이다. △ABC = 24 cm², △ACE = 16 cm²일 때, □ABCD의 넓이는?", "choices     Object.entries(A.answers||{}).forEach(([k,v])=>cur.answers[k]=String(v).split(",").filter(Boolean).map(Number)); (A.stuck||[]).forEach(n=>cur.stuck[n]=true);

const W=1000;
class Pad{
  constructor(canvas, strokes, readOnly, onChange){
    this.c=canvas; this.ctx=canvas.getContext("2d"); this.strokes=strokes; this.ro=readOnly; this.onChange=onChange; this.tool="pen"; this.cur=null;
    this.hUnits = Math.max(420, strokes.reduce((m,s)=>{ for(let i=1;i<s.p.length;i+=2) m=Math.max(m,s.p[i]+40); return m; },0));
    this.resize(); if(!readOnly) this.bind(); window.addEventListener("resize",()=>this.resize());
  }
  resize(){ const cssW=this.c.clientWidth||600; const cssH=Math.round(cssW*this.hUnits/W); const r=window.devicePixelRatio||1;
    this.c.style.height=cssH+"px"; this.c.width=Math.round(cssW*r); this.c.height=Math.round(cssH*r); this.scale=this.c.width/W; this.redraw(); }
  grow(){ this.hUnits+=260; this.resize(); }
  pt(e){ const b=this.c.getBoundingClientRect(); return [Math.round((e.clientX-b.left)/b.width*W), Math.round((e.clientY-b.top)/b.height*this.hUnits)]; }
  bind(){ const c=this.c;
    c.addEventListener("pointerdown",e=>{ if(e.pointerType==="touch"&&e.isPrimary===false) return; c.setPointerCapture(e.pointerId); const [x,y]=this.pt(e); this.cur={e:this.tool==="eraser"?1:0,w:this.tool==="eraser"?28:3,p:[x,y]}; this.strokes.push(this.cur); this.drawStroke(this.cur); e.preventDefault(); });
    c.addEventListener("pointermove",e=>{ if(!this.cur) return; const [x,y]=this.pt(e); const p=this.cur.p; const lx=p[p.length-2], ly=p[p.length-1]; if(Math.abs(x-lx)+Math.abs(y-ly)<3) return; p.push(x,y); this.drawSeg(this.cur,lx,ly,x,y); e.preventDefault(); });
    const up=e=>{ if(!this.cur) return; if(this.cur.p.length===2){ this.cur.p.push(this.cur.p[0]+1,this.cur.p[1]+1); this.drawStroke(this.cur);} this.cur=null; this.onChange&&this.onChange(); };
    c.addEventListener("pointerup",up); c.addEventListener("pointercancel",up); c.addEventListener("pointerleave",up);
  }
  drawSeg(s,x1,y1,x2,y2){ const g=this.ctx, k=this.scale; g.save(); g.lineCap="round"; g.lineJoin="round"; g.lineWidth=s.w*k*1.6; g.strokeStyle="#1b2430"; if(s.e) g.globalCompositeOperation="destination-out"; g.beginPath(); g.moveTo(x1*k,y1*k); g.lineTo(x2*k,y2*k); g.stroke(); g.restore(); }
  drawStroke(s){ const p=s.p; if(p.length<4){ this.drawSeg(s,p[0],p[1],p[0]+1,p[1]+1); return; } for(let i=2;i<p.length;i+=2) this.drawSeg(s,p[i-2],p[i-1],p[i],p[i+1]); }
  redraw(){ this.ctx.clearRect(0,0,this.c.width,this.c.height); this.strokes.forEach(s=>this.drawStroke(s)); }
  undo(){ this.strokes.pop(); this.redraw(); this.onChange&&this.onChange(); }
  clear(){ this.strokes.length=0; this.redraw(); this.onChange&&this.onChange(); }
  async png(){ const off=document.createElement("canvas"); off.width=this.c.width; off.height=this.c.height; const g=off.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,off.width,off.height); g.drawImage(this.c,0,0); return new Promise(r=>off.toBlob(r,"image/png")); }
}
function padHtml(n, ro){
  return `<div class="padwrap"><div class="padbar"><span>풀이 공간</span>${ro?'':`<button class="tool" data-tool="pen" data-n="${n}" aria-pressed="true">펜</button><button class="tool" data-tool="eraser" data-n="${n}" aria-pressed="false">지우개</button><button class="tool" data-undo="${n}">↶ 되돌리기</button><button class="tool" data-clear="${n}">전부 지우기</button><button class="tool" data-grow="${n}">＋ 칸 늘리기</button>`}</div><canvas class="pad ${ro?'ro':''}" id="pad${n}"></canvas></div>`;
}
function mountPads(ro){
  Object.keys(pads).forEach(k=>delete pads[k]);
  cur.P.forEach(p=>{ const c=document.getElementById("pad"+p.n); if(!c) return; cur.scratch[p.n]=cur.scratch[p.n]||[]; if(ro&&!cur.scratch[p.n].length){ c.parentElement.hidden=true; return; } pads[p.n]=new Pad(c, cur.scratch[p.n], ro, saveLocal); });
}
document.addEventListener("click",e=>{
  const t=e.target.closest(".padbar .tool"); if(!t) return;
  if(t.dataset.tool){ const pad=pads[t.dataset.n]; pad.tool=t.dataset.tool; t.parentElement.querySelectorAll("[data-tool]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tool===pad.tool)); }
  if(t.dataset.undo) pads[t.dataset.undo].undo(); if(t.dataset.clear) pads[t.dataset.clear].clear(); if(t.dataset.grow) pads[t.dataset.grow].grow();
});

// ---------- exam ----------
function renderExam(){
  showView("examView"); const s=setOf(cur.set); $("#examTitle").textContent=s.title;
  const host=$("#qlist"); host.innerHTML="";
  cur.P.forEach(p=>{
    const d=document.createElement("div"); d.className="q"; d.id="q"+p.n; const sel=cur.answers[p.n]||[];
    d.innerHTML=`<div class="head"><span><span class="num">${p.n}.</span> <span class="unit">${UNITS[p.unit]}</span></span>
      <span><span class="pts">${p.pts}점</span> <button class="star" aria-pressed="${!!cur.stuck[p.n]}" data-star="${p.n}">★ 막힘</button></span></div>
      <div class="stem">${p.stem}${p.multi?' <b>(두 개)</b>':''}</div>
      ${p.fig?`<div class="fig">${DATA.figs[p.fig]}</div>`:''}
      ${p.box?`<div class="box">${p.box.map(b=>`<div>${b}</div>`).join("")}</div>`:''}
      ${padHtml(p.n,false)}
      <div class="stucknote" ${cur.stuck[p.n]?'':'hidden'}><input type="text" data-note="${p.n}" placeholder="어디서 막혔는지 한 줄 (예: BE=AB까지 하고 다음을 모르겠음)" value="${(cur.stuckNote[p.n]||'').replace(/"/g,'&quot;')}"></div>
      <div class="choices">${p.choices.map((c,i)=>`<button class="choice" data-q="${p.n}" data-i="${i+1}" aria-pressed="${sel.includes(i+1)}"><span class="c">${CIRC[i]}</span><span>${c}</span></button>`).join("")}</div>`;
    host.appendChild(d);
  });
  mountPads(false); updateProg();
  $("#timer").textContent=fmt(cur.elapsed); $("#submitBtn").textContent="채점하기";
  if(cur.started) startTimer();
}
function updateProg(){ const n=cur.P.filter(p=>(cur.answers[p.n]||[]).length).length; $("#prog").textContent=`${n} / ${cur.P.length} 답함`; }
$("#qlist").addEventListener("click",e=>{
  const c=e.target.closest(".choice"); const s=e.target.closest(".star");
  if(c){ const n=+c.dataset.q, i=+c.dataset.i, p=cur.P.find(x=>x.n===n); let a=cur.answers[n]||[];
    if(p.multi){ a=a.includes(i)?a.filter(x=>x!==i):(a.length>=2?[a[1],i]:[...a,i]); } else a=a.includes(i)?[]:[i];
    cur.answers[n]=a; if(!cur.started) startTimer();
    document.querySelectorAll(`.choice[data-q="${n}"]`).forEach(b=>b.setAttribute("aria-pressed",a.includes(+b.dataset.i))); updateProg(); saveLocal(); }
  if(s){ const n=+s.dataset.star; cur.stuck[n]=!cur.stuck[n]; s.setAttribute("aria-pressed",!!cur.stuck[n]); s.closest(".q").querySelector(".stucknote").hidden=!cur.stuck[n]; saveLocal(); }
});
$("#qlist").addEventListener("input",e=>{ if(e.target.dataset.note){ cur.stuckNote[e.target.dataset.note]=e.target.value; saveLocal(); } });
function startTimer(){ if(cur.submitted) return; if(!cur.started) cur.started=Date.now()-cur.elapsed*1000; else cur.started=Date.now()-cur.elapsed*1000;
  clearInterval(timerInt); timerInt=setInterval(()=>{ cur.elapsed=(Date.now()-cur.started)/1000; $("#timer").textContent=fmt(cur.elapsed); },500); saveLocal(); }
$("#quitBtn").addEventListener("click",()=>{ clearInterval(timerInt); saveLocal(); toast("저장했어요. 홈에서 이어서 풀 수 있어요."); renderHome(); });
$("#submitBtn").addEventListener("click",async()=>{
  const n=cur.P.filter(p=>(cur.answers[p.n]||[]).length).length;
  if(n<cur.P.length && !$("#submitBtn").dataset.confirm){ $("#submitBtn").dataset.confirm="1"; $("#submitBtn").textContent=`${cur.P.length-n}문제 비었어요 — 그래도 채점`; setTimeout(()=>{delete $("#submitBtn").dataset.confirm; $("#submitBtn").textContent="채점하기";},3000); return; }
  clearInterval(timerInt); cur.submitted=new Date().toISOString(); if(cur.started) cur.elapsed=(Date.now()-cur.started)/1000;
  cur.attemptId=cur.attemptId||(session.id+"-s"+cur.set+"-"+cur.submitted.replace(/[^0-9]/g,"").slice(0,14));
  saveLocal(); renderResult(); await pushAll();
});

// ---------- grading & result ----------
function grade(){
  const r={score:0, byUnit:{}, wrong:[], right:[], stuck:[]};
  cur.P.forEach(p=>{ const ok=isCorrect(p); const u=r.byUnit[p.unit]=r.byUnit[p.unit]||{n:0,ok:0,pts:0,got:0}; u.n++; u.pts+=p.pts;
    if(ok){u.ok++;u.got+=p.pts;r.score+=p.pts;r.right.push(p.n);} else r.wrong.push(p.n); if(cur.stuck[p.n]) r.stuck.push(p.n); });
  return r;
}
function renderResult(){
  showView("resultView"); const r=grade();
  let msg; if(r.score>=90) msg="거의 다 맞았어요. 틀린 것만 아래에서 '왜'를 확인하면 끝."; else if(r.score>=75) msg="기본은 잡혔어요. 틀린 문제의 풀이를 끝까지 읽고, 궁금하면 선생님에게 물어봐요."; else if(r.score>=55) msg="맞은 것도 많지만 구멍이 여러 개. 오늘은 틀린 문제 3개만 확실히 이해하기."; else msg="점수보다 어디서 막혔는지가 중요해요. ★ 표시한 문제부터 선생님과 같이 봐요.";
  let h=`<div class="score"><div class="big">${r.score}<small> / 100</small></div><div><div class="meta">${setOf(cur.set).title} · ${r.right.length}개 정답 · ${r.wrong.length}개 오답 · ${fmt(cur.elapsed)}${r.stuck.length?` · ★ ${r.stuck.length}개`:""}</div><div class="msg">${msg}</div></div></div>`;
  h+=`<div class="chips">${Object.entries(r.byUnit).map(([u,v])=>`<span class="chip ${v.ok<v.n?'red':''}">${UNITS[u]} ${v.ok}/${v.n}</span>`).join("")}</div>`;
  if(r.wrong.length) h+=`<h2>틀린 문제 (${r.wrong.length})</h2>`+r.wrong.map(n=>qResult(cur.P[n-1],false)).join("");
  h+=`<h2>맞은 문제 (${r.right.length})</h2><p class="note">맞았어도 ★ 표시했거나 찍은 문제는 풀이를 한 번 읽어요.</p>`+r.right.map(n=>qResult(cur.P[n-1],true)).join("");
  h+=`<h2>기록</h2><p class="note">결과는 자동으로 저장돼요 (<span id="dbState">저장 중…</span>). 안 되면 아래 요약을 복사해서 선생님께 보내요.</p><div><button class="btn small" id="copyBtn">요약 복사</button></div><pre class="summary" id="summaryBox">${summaryText()}</pre>`;
  $("#resultBody").innerHTML=h; mountPads(true);
}
function qResult(p,ok){
  const my=cur.answers[p.n]||[];
  return `<div class="q" id="r${p.n}"><div class="head"><span><span class="num">${p.n}.</span> <span class="mark ${ok?'ok':'bad'}">${ok?'○':'✕'}</span> <span class="unit">${UNITS[p.unit]} · ${p.pts}점</span>${cur.stuck[p.n]?' <span class="chip amber">★ 막힘</span>':''}</span><span class="unit">내 답 ${ansText(my)} → 정답 ${ansText(ansArr(p))}</span></div>
    <details ${ok?'':'open'}><summary>문제 · 내 풀이 · 해설</summary>
    <div class="stem" style="margin-top:8px">${p.stem}</div>
    ${p.fig?`<div class="fig">${DATA.figs[p.fig]}</div>`:''}
    ${p.box?`<div class="box">${p.box.map(b=>`<div>${b}</div>`).join("")}</div>`:''}
    ${padHtml(p.n,true)}
    ${cur.stuckNote[p.n]?`<div class="note">★ 막힌 곳: ${cur.stuckNote[p.n]}</div>`:''}
    <div class="choices">${p.choices.map((c,i)=>{const k=i+1;const cls=ansArr(p).includes(k)?'ok':(my.includes(k)?'bad':'');return `<div class="choice ${cls}"><span class="c">${CIRC[i]}</span><span>${c}</span></div>`;}).join("")}</div>
    <div class="sol"><b>풀이 (한 단계도 건너뛰지 않음)</b><ol>${p.sol.map(s=>`<li>${s}</li>`).join("")}</ol>
      <div class="card"><b>함정 · 이 유형 푸는 법</b>${p.trap}</div>${ok?'':`<div class="card blue"><b>틀렸다면</b>${p.fb_wrong}</div>`}</div>
    </details></div>`;
}
function summaryText(){
  const r=grade(); const L=[];
  L.push(`[${setOf(cur.set).title} 결과] ${session?session.name:''} ${r.score}/100 · 시간 ${fmt(cur.elapsed)} · 제출 ${cur.submitted?cur.submitted.slice(0,16).replace("T"," "):""}`);
  L.push("단원별: "+Object.entries(r.byUnit).map(([u,v])=>`${UNITS[u]} ${v.ok}/${v.n}`).join(" · "));
  L.push("오답: "+(r.wrong.map(n=>{const p=cur.P[n-1];return `${n}(${p.pts}점,${UNITS[p.unit]},내답${ansText(cur.answers[n])}→정답${ansText(ansArr(p))}${cur.stuck[n]?',★':''}${cur.stuckNote[n]?',막힘:'+cur.stuckNote[n]:''})`;}).join(" ")||"없음"));
  if(r.stuck.length) L.push("★ 막힘: "+r.stuck.join(", "));
  L.push("개념 id(오답): "+[...new Set(r.wrong.flatMap(n=>cur.P[n-1].concepts))].join(", "));
  return L.join("\n");
}
$("#resultBody").addEventListener("click",e=>{
  if(e.target.id==="copyBtn"){ const t=summaryText(); const done=()=>toast("복사했어요");
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done).catch(()=>toast("길게 눌러 복사하세요")); } else toast("길게 눌러 복사하세요"); }
});

// ---------- db writes ----------
function setDbLabel(t){ const l=$("#dbState"); if(l) l.textContent=t; }
async function pushAll(){
  if(!cur.submitted) return;
  try{
    const r=grade();
    await sb("mock_attempts?on_conflict=id","POST",{id:cur.attemptId, student_id:session.id, student_name:session.name, set_id:cur.set, submitted_at:cur.submitted, seconds:Math.round(cur.elapsed), score:r.score,
      answers:Object.fromEntries(Object.entries(cur.answers).map(([k,v])=>[k,v.join(",")])), wrong:r.wrong, stuck:r.stuck, stuck_note:cur.stuckNote, classify:cur.classify||{},
      by_unit:Object.fromEntries(Object.entries(r.byUnit).map(([u,v])=>[u,`${v.ok}/${v.n}`])), summary:summaryText()}, "resolution=merge-duplicates,return=minimal");
    const rows=cur.P.filter(p=>(cur.scratch[p.n]||[]).length).map(p=>({attempt_id:cur.attemptId, n:p.n, strokes:cur.scratch[p.n].map(s=>({e:s.e,w:s.w,p:s.p}))}));
    if(rows.length) await sb("mock_scratch?on_conflict=attempt_id,n","POST",rows,"resolution=merge-duplicates,return=minimal");
    setDbLabel("저장됨 — 선생님이 바로 볼 수 있어요");
  }catch(e){ setDbLabel("저장이 안 됐어요 — 요약을 복사해서 보내요"); }
}


(function boot(){
  try{ session=JSON.parse(localStorage.getItem("mock_session")||"null"); }catch(e){}
  renderWho();
  if(session){ renderHome(); } else showView("loginView");
})();
</script>
</body></html>
